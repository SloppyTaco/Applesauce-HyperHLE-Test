name: Verify existing Order Up V15 emulator IPA

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/verify-order-up-v15.yml'

permissions:
  contents: read
  actions: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout the exact build configuration
        uses: actions/checkout@v4
        with:
          ref: 38ca0da60539ad730714777e46c6b709419376e0
      - name: Download the successful V15 build
        uses: actions/download-artifact@v4
        with:
          name: Applesauce-HLE-Rendering-Test-v15
          run-id: 38021882355
          github-token: ${{ github.token }}
          path: download
      - name: Verify the IPA and prepare its download name
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import hashlib, json, plistlib, shutil, struct, zipfile
          
          root = Path(".")
          source = root / "download/Applesauce-HLE-Rendering-Test.ipa"
          expected_commit = "38ca0da60539ad730714777e46c6b709419376e0"
          expected = (root / "download/Applesauce-HLE-Rendering-Test.ipa.sha256").read_text().split()[0]
          actual = hashlib.sha256(source.read_bytes()).hexdigest()
          assert actual == expected, "IPA checksum mismatch"
          build_info = (root / "download/BUILD_INFO.txt").read_text()
          assert "Build configuration: " + expected_commit in build_info
          assert "Applesauce iOS base: c75278bda86c80cbcec2d8d1493b5be9d5a9e0d1" in build_info
          assert "v15 validate the existing Chef.wad cache" in build_info
          patches = []
          for line in build_info.splitlines():
              if "  ../patches/" not in line:
                  continue
              digest, relative = line.split("  ", 1)
              name = Path(relative).name
              patches.append(name)
              assert hashlib.sha256((root / "patches" / name).read_bytes()).hexdigest() == digest, name
          assert len(patches) == 12 and len(set(patches)) == 12
          assert "order-up-cache-v15.patch" in patches
          assert hashlib.sha256((root / "patches/order-up-cache-v15.patch").read_bytes()).hexdigest() == "1a18521f8cac9cf55f08653f883df099c7092de505cd75120fb8dfc96f4dfa7a"
          
          with zipfile.ZipFile(source) as ipa:
              assert ipa.testzip() is None, "IPA archive integrity failure"
              info = plistlib.loads(ipa.read("Payload/Applesauce.app/Info.plist"))
              assert info["CFBundleIdentifier"] == "io.github.sloppytaco.applesaucehyperhletest"
              assert info["CFBundleDisplayName"] == "Applesauce HLE Test"
              host = ipa.read("Payload/Applesauce.app/" + info["CFBundleExecutable"])
              core = ipa.read("Payload/Applesauce.app/Frameworks/libhyperhle_core.dylib")
              for binary in [host, core]:
                  magic, cpu = struct.unpack_from("<II", binary)
                  assert magic == 0xFEEDFACF and cpu == 0x0100000C, "Expected ARM64 Mach-O"
              markers = [
                  b"[ORDER UP CACHE v15]", b"[ORDER UP CLASS v15]",
                  b"[ORDER UP HOOK v14]", b"[ORDER UP SJLJ v14]",
                  b"[ORDER UP INIT v13]", b"[ORDER UP RECOVERY v13]",
                  b"[ORDER UP MODULE v13]", b"[ORDER UP RESTAURANT v13]",
                  b"[ORDER UP NIL v13]", b"[ORDER UP STACK v13]", b"[ORDER UP SHADER v13]",
                  b"[ORDER UP GEOMETRY v12]", b"[ORDER UP VIEWPORT GEOMETRY v12]",
                  b"[ORDER UP FIX v11]", b"[ORDER UP UNIFORM v11]",
                  b"[ORDER UP VERTEX v11]", b"[ORDER UP INPUTS v11]",
                  b"[ORDER UP DISPLAY v10]", b"[ORDER UP FIX v10]", b"[ORDER UP FIX v8]",
                  b"4803003a568c0e3d0ce4132378902dfce966dfde57935aacf6cd719528f28f85",
                  b"662041f674c65c3d3323207cf680a58be19eeb1a0d4864ff2750de5a4dfa7ccb",
                  b"data_iph_wad/chef_v1b.pkg", b"Chef.wad.v15-backup-",
                  b"No existing cache; leaving first extraction to the game."
              ]
              for marker in markers:
                  assert marker in core, "Missing compiled marker or cache guard: " + marker.decode()
              assert b"green_square_rgba=" not in core
              assert b"[LOCAL CSL]" not in core and b"[LOCAL CLASS]" not in core
              assert not any(name.startswith("Payload/Chef.app/") or name.endswith(("/Chef.wad", "/chef_v1b.pkg")) for name in ipa.namelist()), "Unexpected private game assets"
          
          out = root / "verified"
          out.mkdir()
          target = out / "Applesauce-OrderUp-Cache-Repair-v15.ipa"
          shutil.copyfile(source, target)
          (out / (target.name + ".sha256")).write_text(actual + "  " + target.name + "\n")
          report = {
              "filename": target.name, "bytes": target.stat().st_size, "sha256": actual,
              "build_commit": expected_commit, "source_run": 38021882355, "source_artifact": 11658284178,
              "patch_count": len(patches), "bundle_id": info["CFBundleIdentifier"],
              "checks": "IPA checksum and archive integrity; pinned commit and 12 patch hashes; ARM64 host/core; compiled V15 cache guards and earlier fixes",
              "phone_tutorial_gameplay": "unverified"
          }
          (out / "verification.json").write_text(json.dumps(report, indent=2) + "\n")
          print(json.dumps(report))
          
          PY
