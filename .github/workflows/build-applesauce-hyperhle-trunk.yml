name: Build Applesauce native interruption input fix v23

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-applesauce-hyperhle-trunk.yml'
      - 'patches/**'
      - 'tests/native-alert-v20.m'
      - 'tests/run-native-alert-v20.py'
      - 'tests/run-native-alert-v22.py'
      - 'tests/native-alert-taps-v22.m'
      - 'tests/native-alert-taps-v22.swift'
      - 'tests/run-native-resume-v23.py'
      - 'tests/native-resume-v23.swift'
      - 'tests/native-resume-taps-v23.swift'

permissions:
  contents: read

concurrency:
  group: applesauce-rendering-test-${{ github.ref }}
  cancel-in-progress: true

env:
  DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
  APPLESAUCE_REF: c75278bda86c80cbcec2d8d1493b5be9d5a9e0d1
  TEST_BUNDLE_ID: io.github.sloppytaco.applesaucehyperhletest

jobs:
  native-checks:
    name: Native interruption and alert checks
    runs-on: macos-15
    timeout-minutes: 35
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout build repo
        uses: actions/checkout@v4
      - name: Show native toolchain
        run: |
          set -euo pipefail
          sw_vers
          xcodebuild -version
      - name: Verify native timer entry, queued completions, and interruption taps
        run: |
          set -euo pipefail
          python3 tests/run-native-resume-v23.py --log native-resume-v23.log
      - name: Verify retained native alert state and real XCUI taps
        run: |
          set -euo pipefail
          python3 tests/run-native-alert-v22.py --log native-alert-v22.log
      - name: Upload native input validation
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-input-validation-v23
          path: |
            native-alert-v22.log
            native-state-v22.log
            native-taps-*.log
            native-resume*.log
          if-no-files-found: warn

  build:
    runs-on: macos-15
    timeout-minutes: 90
    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout build repo
        uses: actions/checkout@v4

      - name: Show toolchain
        run: |
          set -euo pipefail
          sw_vers
          xcodebuild -version
          rustc --version
          cargo --version

      - name: Install build dependencies
        run: |
          set -euo pipefail
          brew install cmake ninja boost ldid
          rustup target add aarch64-apple-ios

      - name: Checkout working Applesauce iOS source
        run: |
          set -euo pipefail
          git clone --branch ios-host https://github.com/johnny901901901/Applesauce.git applesauce
          git -C applesauce checkout --detach "$APPLESAUCE_REF"
          git -C applesauce submodule update --init --recursive

      - name: Apply reviewed compatibility patches
        run: |
          set -euo pipefail
          git -C applesauce apply --check ../patches/ios-rendering-backport.patch
          git -C applesauce apply ../patches/ios-rendering-backport.patch
          git -C applesauce apply --check ../patches/order-up-crystal-bypass.patch
          git -C applesauce apply ../patches/order-up-crystal-bypass.patch
          python3 patches/order-up-viewport-v6.py
          python3 patches/order-up-framebuffer-v7.py
          python3 patches/order-up-crystal-resume-v8.py
          python3 patches/order-up-render-probe-v9.py
          python3 patches/order-up-scissor-present-v10.py
          python3 patches/order-up-shader-inputs-v11.py
          python3 patches/order-up-engine-geometry-v12.py
          python3 patches/order-up-restaurant-init-v13.py
          python3 patches/order-up-sjlj-hook-v14.py
          git -C applesauce apply --check ../patches/order-up-cache-v15.patch
          git -C applesauce apply ../patches/order-up-cache-v15.patch
          git -C applesauce apply --check ../patches/order-up-wide-strings-v16.patch
          git -C applesauce apply ../patches/order-up-wide-strings-v16.patch
          git -C applesauce apply --check ../patches/order-up-profile-ids-v17.patch
          git -C applesauce apply ../patches/order-up-profile-ids-v17.patch
          python3 patches/order-up-download-v18.py
          python3 patches/order-up-loading-v19.py
          python3 patches/order-up-alerts-v20.py
          python3 patches/order-up-application-loop-v21.py
          python3 patches/order-up-dlc-v22.py
          python3 patches/ios-main-run-loop-v23.py
          git -C applesauce diff --check
          git -C applesauce diff --stat

      - name: Typecheck the actual patched native host before compiling Rust
        run: |
          set -euo pipefail
          sdk_path=$(xcrun --sdk iphoneos --show-sdk-path)
          xcrun swiftc -typecheck -swift-version 5 -target arm64-apple-ios16.0 -sdk "$sdk_path" \
            -import-objc-header applesauce/platform/ios/Sources/TouchHLEHost-Bridging-Header.h \
            applesauce/platform/ios/Sources/EmulatorCore.swift \
            applesauce/platform/ios/Sources/NativeHost.swift 2>&1 | tee native-host-typecheck-v23.log

      - name: Keep existing test-app identity and set V23 version
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os
          from pathlib import Path
          config = Path('applesauce/platform/ios/Config/Build.xcconfig')
          original = 'PRODUCT_BUNDLE_IDENTIFIER = io.github.johnny901901901.applesauce'
          text = config.read_text()
          assert original in text
          config.write_text(text.replace(original, 'PRODUCT_BUNDLE_IDENTIFIER = ' + os.environ['TEST_BUNDLE_ID']))
          verifier = Path('applesauce/platform/ios/scripts/verify-ipa.sh')
          verifier.write_text(verifier.read_text().replace('io.github.johnny901901901.applesauce', os.environ['TEST_BUNDLE_ID']))
          PY
          /usr/libexec/PlistBuddy -c 'Set :CFBundleDisplayName Applesauce HLE Test' applesauce/platform/ios/Config/Info.plist
          /usr/libexec/PlistBuddy -c 'Set :CFBundleShortVersionString 23.0.0' applesauce/platform/ios/Config/Info.plist
          /usr/libexec/PlistBuddy -c 'Set :CFBundleVersion 23' applesauce/platform/ios/Config/Info.plist

      - name: Build shared SDL for iPhone
        run: |
          set -euo pipefail
          cd applesauce
          export DEVELOPER_DIR
          export TOUCHHLE_BOOST_ROOT="$(brew --prefix boost)/include"
          sh platform/ios/scripts/build-sdl-shared.sh iphoneos 2>&1 | tee ../build-sdl.log

      - name: Build unsigned iPhone app
        run: |
          set -euo pipefail
          cd applesauce
          export DEVELOPER_DIR
          export TOUCHHLE_BOOST_ROOT="$(brew --prefix boost)/include"
          sh platform/ios/scripts/build-host.sh iphoneos Release 2>&1 | tee ../build-host.log

      - name: Package and verify unsigned IPA
        run: |
          set -euo pipefail
          cd applesauce
          mkdir -p dist
          sh platform/ios/scripts/package-ipa.sh dist/Applesauce-HLE-Rendering-Test.ipa 2>&1 | tee ../package.log
          sh platform/ios/scripts/verify-ipa.sh dist/Applesauce-HLE-Rendering-Test.ipa 2>&1 | tee ../verify-ipa.log
          shasum -a 256 dist/Applesauce-HLE-Rendering-Test.ipa > dist/Applesauce-HLE-Rendering-Test.ipa.sha256
          {
            echo "Applesauce iOS base: $APPLESAUCE_REF"
            echo "Graphics: targeted HyperHLE-derived backport; not the full trunk core"
            echo "Order Up: v4 NIB viewDidLoad fix + v5 Crystal UI bypass + v6 viewport correction/trace + v8 synthetic Crystal dismissal/resume + v9 source/draw diagnostics + v10 empty-scissor repair, direct ES2 presentation and display readback + v11 invalid screen_dims repair and shader-input diagnostics + v12 executable-guarded engine geometry repair (phone menu confirmed) + v13 guarded replay of original restaurant initialization for an empty/unselected manager before level setup, with module/nil/shader traces + v14 SjLj observation wrappers retain original guest libgcc behavior and activate the recovery trigger + v15 validate the existing Chef.wad cache and restore only from the exact original archive, preserving the old cache and game saves; green control square removed; v16 correct 32-bit wide-string formatting and observe original purchase/ownership state without altering it; v17 recover an entirely blank restaurant ID table using only identities recorded from the original initializer, preserving every other profile byte; v18 separate native button clicks from guarded programmatic alert dismissal to prevent the confirmed recursive callback freeze, and verify/install a private Diner/Common content pack without altering original Chef.wad, purchases or saves"
            echo "Build configuration: $GITHUB_SHA"
            echo "Builder: macos-15 (ARM64) with Xcode 26.3 and iOS 26.2 SDK, explicitly selected from the official supported runner image."
            echo "V19: buttonless loading alerts return immediately and retain their presentation until original game dismissal; existing V18 button prompts and the complete previous patch chain are retained. This first 1.41 startup fix does not port 1.0-specific recovery or claim full 1.41 gameplay compatibility."
            echo "V20: button alerts return immediately on iOS; copied UIKit state records one real user selection for delivery on the guest main run loop. Dedicated non-animated alert window sits above game controls. Programmatic dismissal, duplicate events and core exit cancel native state/timers without synthetic clicks. Existing loading, callbacks, private-pack guards and original 1.0 fallback are preserved."
            echo "Native UIKit: the independent native-checks job must pass four state/event cases and four actual XCUI taps during occupied main dispatch, with the previous deferred-handler stall reproduced. This compiled artifact alone does not attest those results."
            echo "Retained V21: UIApplicationMain restarts stopped main-run-loop activations instead of returning the last timer pointer to guest main and closing the app. CFRunLoopRun/Stop callers, genuine guest exit/abort, all previous alerts and 1.0-specific guards remain unchanged. Nonzero exits record a caller stack for diagnosis. The user confirmed V21 fully loads 1.41; their next log shows a native popup visually disappearing without any button-selection delivery."
            echo "V22: Direct public UIKit UIButton target/action replaces deferred UIAlertAction dismissal handlers while keeping token, queue, copied-string and guest-polling semantics. A separate exact-executable-guarded 1.41 pack installs only Marketplace and eleven assistant WADs with audio; the base Chef/Common data, Fry Guy, saves, purchase/hiring rules and currency remain untouched. Private game data is never uploaded to GitHub."
            echo "Bundle ID: $TEST_BUNDLE_ID"
            echo "V23: The full emulator call starts from a one-shot native main-run-loop timer, after the preparation dispatch callback returns. SDL can service queued UIKit restoration/completion work during gameplay. Emulation stays on the main thread; the existing metadata-refresh guard, background GL pause, V21 run-loop fix, V22 direct alerts and all content/save guards are retained."
            echo "V23 native validation is recorded by this workflow's independent native-checks job. Release requires the reproduced occupied-main-dispatch baseline, queued completion serviced during the production timer entry, and five real game/exit taps across Home, Control Center, and Home. The native job and retained guest regressions must pass before private packaging; a compiled IPA alone does not verify input recovery. Actual iPhone gameplay still needs user verification."
            shasum -a 256 ../patches/ios-rendering-backport.patch
            shasum -a 256 ../patches/order-up-crystal-bypass.patch
            shasum -a 256 ../patches/order-up-viewport-v6.py
            shasum -a 256 ../patches/order-up-framebuffer-v7.py
            shasum -a 256 ../patches/order-up-crystal-resume-v8.py
            shasum -a 256 ../patches/order-up-render-probe-v9.py
            shasum -a 256 ../patches/order-up-scissor-present-v10.py
            shasum -a 256 ../patches/order-up-shader-inputs-v11.py
            shasum -a 256 ../patches/order-up-engine-geometry-v12.py
            shasum -a 256 ../patches/order-up-restaurant-init-v13.py
            shasum -a 256 ../patches/order-up-sjlj-hook-v14.py
            shasum -a 256 ../patches/order-up-cache-v15.patch
            shasum -a 256 ../patches/order-up-wide-strings-v16.patch
            shasum -a 256 ../patches/order-up-profile-ids-v17.patch
            shasum -a 256 ../patches/order-up-download-v18.py
            shasum -a 256 ../patches/order-up-loading-v19.py
            shasum -a 256 ../patches/order-up-alerts-v20.py
            shasum -a 256 ../patches/async-alert-uikit-v20.inc
            shasum -a 256 ../patches/order-up-application-loop-v21.py
            shasum -a 256 ../patches/order-up-dlc-v22.py
            shasum -a 256 ../patches/order-up-dlc-v22.rs
            shasum -a 256 ../patches/async-alert-uikit-v22.inc
            shasum -a 256 ../patches/ios-main-run-loop-v23.py
            shasum -a 256 ../patches/main-run-loop-launch-v23.swift
          } > dist/BUILD_INFO.txt

      - name: Check emulator-only package and compiled V23 host entry
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import plistlib, struct, zipfile
          from pathlib import Path
          path = Path('applesauce/dist/Applesauce-HLE-Rendering-Test.ipa')
          with zipfile.ZipFile(path) as ipa:
              assert ipa.testzip() is None
              names = ipa.namelist()
              assert all(not name.startswith('Payload/Chef.app/') for name in names)
              assert all(not name.lower().endswith(('.wad', '.pkg', '/chef', '.svs')) for name in names)
              info = plistlib.loads(ipa.read('Payload/Applesauce.app/Info.plist'))
              assert info['CFBundleIdentifier'] == 'io.github.sloppytaco.applesaucehyperhletest'
              assert info['CFBundleDisplayName'] == 'Applesauce HLE Test'
              assert info['CFBundleShortVersionString'] == '23.0.0'
              assert str(info['CFBundleVersion']) == '23'
              host = ipa.read('Payload/Applesauce.app/' + info['CFBundleExecutable'])
              assert b'[MAIN RUN LOOP v23]' in host
              assert b'TouchHLEMainRunLoopLaunch' in host
              core = ipa.read('Payload/Applesauce.app/Frameworks/libhyperhle_core.dylib')
              assert struct.unpack_from('<II', core) == (0xFEEDFACF, 0x0100000C)
              for marker in (b'[ORDER UP FORMAT v16]', b'[ORDER UP PURCHASE v16]',
                             b'[ORDER UP OWNERSHIP v16]', b'[ORDER UP CACHE v15]',
                             b'[ORDER UP PROFILE v17]', b'[ORDER UP DOWNLOAD v18]',
                             b'[ALERT CALLBACK v18]', b'[ALERT LOADING v19]', b'[ALERT ASYNC v20]',
                             b'[APPLICATION LOOP v21]', b'[GUEST EXIT v21]', b'[ORDER UP DLC v22]'):
                  assert marker in core, marker
              native = [name for name in names if name.startswith('Payload/Applesauce.app/Frameworks/') and 'SDL' in name and name.endswith('.dylib')]
              assert len(native) == 1, native
              sdl = ipa.read(native[0])
              for symbol in (b'_SDL_TOUCHHLE_AlertBeginV20', b'_SDL_TOUCHHLE_AlertPollV20',
                             b'_SDL_TOUCHHLE_AlertDismissV20', b'_SDL_TOUCHHLE_AlertResetV20'):
                  assert symbol in sdl, symbol
              assert b'[ALERT NATIVE v22]' in sdl
          print('Verified V23 native timer entry with retained ARM64 V22 core/DLC/direct-alert support; emulator-only IPA has no private game assets.')
          PY

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: Applesauce-HLE-Rendering-Test-v23
          path: |
            applesauce/dist/Applesauce-HLE-Rendering-Test.ipa
            applesauce/dist/Applesauce-HLE-Rendering-Test.ipa.sha256
            applesauce/dist/BUILD_INFO.txt
          if-no-files-found: error

      - name: Upload build diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-diagnostics
          path: |
            build-sdl.log
            build-host.log
            package.log
            verify-ipa.log
            native-host-typecheck-v23.log
          if-no-files-found: warn
